# Runs the whole data pipeline (see scripts/README.md) on a schedule —
# one `bun run scripts/main.ts` call that does update then normalize —
# and commits any resulting raw/data changes back to the repo.
#
# Disabled on purpose in THIS repo (the template): the `if:` guard below
# checks `github.event.repository.is_template`, which GitHub sets to
# `true` only for a repo with the "Template repository" setting enabled
# (Settings -> General -> Template repository) — i.e. this repo itself.
# Any repo created via "Use this template" starts with that setting off,
# so the guard evaluates to `true` there automatically and the pipeline
# runs with zero edits to this file. No repo name/owner is hardcoded, so
# this keeps working even if the template or the generated repo gets
# renamed/transferred.
#
# Secrets are passed wholesale as one JSON blob via
# `SECRETS_CONTEXT: ${{ toJSON(secrets) }}` and unpacked into the
# environment by scripts/main.ts. That keeps this file connector-agnostic:
# a connector with a new token needs a new repository secret (Settings ->
# Secrets and variables -> Actions), not an edit here. This matters
# doubly because sync-template.yml deliberately never syncs
# `.github/workflows/` — a workflow edit would otherwise have to be
# hand-copied into every generated repo.
#
# One thing that can't be automated away: connector secrets (currently
# YANDEX_MUSIC_TOKEN) must be added in each new repo — GitHub never
# copies secrets from a template. Until a secret is added, the pipeline
# just skips that connector (see scripts/update.ts) rather than failing
# the run.
name: Main Pipeline

on:
    schedule:
        # 03:00 Moscow time (UTC+3) — cron runs in UTC, so that's 00:00 UTC.
        - cron: '0 0 * * *'
    workflow_dispatch: {}

permissions:
    contents: write

concurrency:
    group: main-pipeline
    cancel-in-progress: false

jobs:
    main:
        if: ${{ !github.event.repository.is_template }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - run: bun install --frozen-lockfile

            - name: Update and normalize
              env:
                  SECRETS_CONTEXT: ${{ toJSON(secrets) }}
              run: bun run scripts/main.ts

            - name: Commit and push data
              run: |
                  git config user.name "dormouse"
                  git config user.email "dormouse@mail.com"
                  # `git add` on a missing path is fatal, and a fresh repo with
                  # no connector secrets yet has neither raw/ nor data/ — the
                  # pipeline only creates them once a token is configured.
                  for dir in raw data; do
                    if [ -d "$dir" ]; then git add "$dir"; fi
                  done
                  if git diff --cached --quiet; then
                    echo "No data changes to commit."
                  else
                    git commit -m "chore: sync data $(date -u +%Y-%m-%d)"
                    git push
                  fi
