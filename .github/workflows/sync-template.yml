# Pulls updates from the upstream template (lld4n/dormouse-template) into
# this repo, so repos created via "Use this template" aren't stuck on a
# snapshot of the template forever.
#
# - Clean merge (no conflicts): pushed straight to the default branch, no
#   PR, no review step — see the discussion that led here for why.
# - Conflicting merge: pushed to the `template-sync` branch as-is (with
#   conflict markers) and a GitHub issue is opened describing it — the
#   human-facing "someone needs to look at this" signal (GitHub's own
#   notification for it is what actually tells the repo owner).
# - Either way, `data/extra/template-sync-status.json` (written by
#   `scripts/sync-status.ts`) is updated on the default branch — the
#   machine-facing signal, readable with one file fetch instead of an
#   Issues API query. See that script's header comment for the full
#   reasoning and file schema.
# - While a conflict issue is open, the workflow no-ops on every
#   subsequent run rather than re-merging — a fresh merge would blow away
#   any manual conflict-resolution commits already pushed to
#   `template-sync`. Once that branch is merged into the default branch,
#   the next run detects it, closes the issue, resets the status file to
#   "clean", and resumes normal syncing automatically.
#
# `.github/workflows/` is deliberately NEVER synced: after every merge
# (clean or conflicted) that path is forced back to this repo's own
# pre-merge state, so template-side workflow changes don't propagate and
# can't conflict. Two reasons: GITHUB_TOKEN is forbidden by GitHub from
# pushing changes to workflow files (deliberate anti-privilege-escalation
# behavior, no `permissions:` key unlocks it — the alternative is a
# per-repo PAT secret, which is exactly the kind of manual setup this
# template tries to avoid), and a workflow that rewrites itself mid-run
# is a footgun anyway. The cost: a workflow improvement in the template
# has to be hand-copied into generated repos. Note this is done with a
# post-merge restore (`git checkout --no-overlay HEAD -- ...`), not a
# `.gitattributes` merge driver — custom merge drivers only fire on
# conflicting files, while a file changed only on the template side gets
# taken wholesale by the trivial three-way merge without ever consulting
# the driver.
#
# `raw/` and `data/<connector>/` need no special handling to stay out of
# this: the template repo's own history never touches those paths (see
# scripts/README.md — they're instance-specific and gitignored-by-omission,
# auto-created at runtime), so a merge from it can never add, modify, or
# delete anything under them here. `data/extra/template-sync-status.json`
# is the same story — generated by this workflow, never shipped by the
# template, so it's equally immune.
#
# Disabled in the template itself via the same `is_template` guard as
# main-pipeline.yml — see that file's header comment for how/why it works
# with zero edits needed in repos generated from this template.
name: Sync Template

on:
    schedule:
        - cron: '0 2 * * 1'
    workflow_dispatch: {}

permissions:
    contents: write
    issues: write

concurrency:
    group: sync-template
    cancel-in-progress: false

env:
    GH_TOKEN: ${{ github.token }}
    TEMPLATE_URL: https://github.com/lld4n/dormouse-template.git
    BRANCH: template-sync
    ISSUE_TITLE: Template sync has conflicts

jobs:
    sync:
        if: ${{ !github.event.repository.is_template }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            # Look for an open conflict issue from a previous run. If there is
            # one, check whether `template-sync` has since been merged into the
            # default branch (i.e. the owner resolved and pushed it) — if so,
            # close the issue, reset the status file to clean, and fall through
            # to a normal sync; otherwise skip this run entirely so we never
            # overwrite unresolved manual work.
            - name: Resolve or detect an existing conflict issue
              id: existing
              run: |
                  number=$(gh issue list --state open --json number,title --jq '.[] | select(.title == "'"$ISSUE_TITLE"'") | .number' | head -n1)

                  if [ -z "$number" ]; then
                    echo "open=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  default_branch="${{ github.event.repository.default_branch }}"
                  if git ls-remote --exit-code origin "$BRANCH" >/dev/null 2>&1 && \
                     git fetch origin "$BRANCH" "$default_branch" -q && \
                     git merge-base --is-ancestor "origin/$BRANCH" "origin/$default_branch"; then
                    gh issue close "$number" --comment "Resolved — \`$BRANCH\` is merged into \`$default_branch\`. Resuming automatic syncing."

                    git config user.name "${{ github.repository_owner }}"
                    git config user.email "${{ github.repository_owner }}@users.noreply.github.com"
                    bun run scripts/sync-status.ts clean --template-url="$TEMPLATE_URL"
                    git add data/extra/template-sync-status.json
                    git commit -m "chore: template sync status is clean"
                    git push origin "HEAD:$default_branch"

                    echo "open=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "open=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Merge template changes
              if: steps.existing.outputs.open == 'false'
              id: merge
              run: |
                  git config user.name "${{ github.repository_owner }}"
                  git config user.email "${{ github.repository_owner }}@users.noreply.github.com"

                  upstream_branch=$(git ls-remote --symref "$TEMPLATE_URL" HEAD | awk '/^ref:/ { sub("refs/heads/", "", $2); print $2 }')
                  git remote add template "$TEMPLATE_URL"
                  git fetch template "$upstream_branch"
                  echo "template_commit=$(git rev-parse template/$upstream_branch)" >> "$GITHUB_OUTPUT"

                  git switch -C "$BRANCH"

                  # --no-commit so `.github/workflows/` can be forced back to
                  # this repo's version before anything is recorded — see the
                  # header comment for why that path is never synced. The
                  # `--no-overlay` checkout makes the path *exactly* match
                  # HEAD: it overwrites modified files, resurrects deleted
                  # ones, drops template-added ones, and resolves any
                  # conflicted ones to our side, all in one command.
                  if git merge --allow-unrelated-histories --no-ff --no-commit "template/$upstream_branch"; then
                    if [ -f .git/MERGE_HEAD ]; then
                      git checkout --no-overlay HEAD -- .github/workflows
                      git commit --no-edit
                    fi
                    echo "conflicts=false" >> "$GITHUB_OUTPUT"
                  else
                    git checkout --no-overlay HEAD -- .github/workflows
                    conflict_files=$(git diff --name-only --diff-filter=U)

                    if [ -z "$conflict_files" ]; then
                      # Every conflict was inside .github/workflows and the
                      # restore just resolved them all — this is a clean merge.
                      git add -A
                      git commit --no-edit
                      echo "conflicts=false" >> "$GITHUB_OUTPUT"
                    else
                      {
                        echo "files<<CONFLICT_FILES_EOF"
                        echo "$conflict_files"
                        echo "CONFLICT_FILES_EOF"
                      } >> "$GITHUB_OUTPUT"
                      git add -A
                      git commit -m "chore: merge template (unresolved conflicts)"
                      echo "conflicts=true" >> "$GITHUB_OUTPUT"
                    fi
                  fi

            - name: Push clean merge straight to the default branch
              if: steps.existing.outputs.open == 'false' && steps.merge.outputs.conflicts == 'false'
              run: |
                  default_branch="${{ github.event.repository.default_branch }}"
                  if git diff --quiet HEAD "origin/$default_branch"; then
                    echo "Nothing new from the template."
                    exit 0
                  fi

                  bun run scripts/sync-status.ts clean \
                    --template-url="$TEMPLATE_URL" \
                    --template-commit="${{ steps.merge.outputs.template_commit }}"
                  git add data/extra/template-sync-status.json
                  git commit -m "chore: template sync status is clean"

                  git push origin "$BRANCH:$default_branch"

            - name: Push conflicted branch and open an issue
              if: steps.existing.outputs.open == 'false' && steps.merge.outputs.conflicts == 'true'
              run: |
                  git push origin "$BRANCH" --force

                  default_branch="${{ github.event.repository.default_branch }}"
                  files="${{ steps.merge.outputs.files }}"

                  body=$(cat <<EOF
                  Syncing changes from $TEMPLATE_URL into \`$BRANCH\` produced merge conflicts in:

                  $files

                  To resolve:

                  \`\`\`
                  git fetch origin $BRANCH
                  git checkout $BRANCH
                  # fix the conflicts, then:
                  git add .
                  git commit
                  git push origin $BRANCH
                  \`\`\`

                  Then merge \`$BRANCH\` into \`$default_branch\` (PR or direct push). The next scheduled sync run will notice it's merged and close this issue automatically.
                  EOF
                  )

                  issue_url=$(gh issue create --title "$ISSUE_TITLE" --body "$body")
                  issue_number="${issue_url##*/}"

                  git switch "$default_branch"
                  files_csv=$(printf '%s' "$files" | tr '\n' ',' | sed 's/,$//')
                  bun run scripts/sync-status.ts conflict \
                    --template-url="$TEMPLATE_URL" \
                    --branch="$BRANCH" \
                    --issue="$issue_number" \
                    --files="$files_csv"
                  git add data/extra/template-sync-status.json
                  git commit -m "chore: template sync status is conflict"
                  git push origin "HEAD:$default_branch"
